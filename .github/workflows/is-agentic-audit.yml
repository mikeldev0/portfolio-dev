name: Is Agentic audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify commit preview has the new API
        env:
          TARGET_DOMAIN: 4b649d7d-portfolio-dev.mikel-e-g-2004.workers.dev
        shell: bash
        run: |
          curl --fail --silent --show-error "https://${TARGET_DOMAIN}/api/profile" > /dev/null
          curl --fail --silent --show-error "https://${TARGET_DOMAIN}/openapi.json" | grep -q '"openapi":"3.1.0"'

      - name: Run fresh Is Agentic audit against unique commit preview
        env:
          TARGET_DOMAIN: 4b649d7d-portfolio-dev.mikel-e-g-2004.workers.dev
        run: npx -y is-agentic "$TARGET_DOMAIN"

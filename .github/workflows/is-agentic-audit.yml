name: Is Agentic final audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify public agent endpoints
        env:
          BASE_URL: https://0c7ea06d-portfolio-dev.mikel-e-g-2004.workers.dev
        run: node scripts/verify-agent-readiness.mjs

      - name: Run fresh Is Agentic audit
        run: npx -y is-agentic 0c7ea06d-portfolio-dev.mikel-e-g-2004.workers.dev

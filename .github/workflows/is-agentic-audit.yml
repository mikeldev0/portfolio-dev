name: Is Agentic final audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify final commit preview
        env:
          TARGET_DOMAIN: ac3a0235-portfolio-dev.mikel-e-g-2004.workers.dev
        shell: bash
        run: |
          curl --fail --silent --show-error "https://${TARGET_DOMAIN}/api/v1/profile" > /dev/null
          curl --fail --silent --show-error "https://${TARGET_DOMAIN}/openapi.json" | grep -q '"/api/v1/profile"'

      - name: Run fresh Is Agentic audit
        env:
          TARGET_DOMAIN: ac3a0235-portfolio-dev.mikel-e-g-2004.workers.dev
        run: npx -y is-agentic "$TARGET_DOMAIN"

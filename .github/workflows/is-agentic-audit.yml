name: Is Agentic diagnostic audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed agent readiness
        env:
          BASE_URL: https://91708270-portfolio-dev.mikel-e-g-2004.workers.dev
        run: node scripts/verify-agent-readiness.mjs

      - name: Run Is Agentic audit
        run: npx -y is-agentic 91708270-portfolio-dev.mikel-e-g-2004.workers.dev
